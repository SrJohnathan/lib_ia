[package]
name = "lib-rust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
serde = {version = "1" , features= ["derive"]}
serde_json = "1"
libc = "0.2"
base64 = "0.22"
tempfile = "3"
tokio = { version = "1.53.1"  , features = ["rt-multi-thread"]}
portable-pty = "0.9.0"
similar = "3.2.0"
reqwest = { version = "0.13.5", features = ["rustls", "blocking", "json"] }
